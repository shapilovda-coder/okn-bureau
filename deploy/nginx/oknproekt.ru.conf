server {
    listen 127.0.0.1:8443 ssl;
    server_name oknproekt.ru www.oknproekt.ru;

    root /var/www/oknproekt/current;
    index index.html;
    client_max_body_size 1m;
    error_page 404 /404.html;

    if ($host = www.oknproekt.ru) {
        return 301 https://oknproekt.ru$request_uri;
    }

    # Keep one indexable URL for every HTML page.
    location = /index.html { return 301 https://oknproekt.ru/$is_args$args; }
    location = /blog-static.html { return 301 https://oknproekt.ru/blog$is_args$args; }
    location = /contacts-static.html { return 301 https://oknproekt.ru/contacts$is_args$args; }
    location = /cases-static.html { return 301 https://oknproekt.ru/cases$is_args$args; }

    location = /service-restavratsiya.html { return 301 https://oknproekt.ru/proekt-restavratsii-okn$is_args$args; }
    location = /service-sohrannost.html { return 301 https://oknproekt.ru/razdel-obespecheniya-sohrannosti-okn$is_args$args; }
    location = /service-prisposoblenie.html { return 301 https://oknproekt.ru/proekt-prisposobleniya-okn$is_args$args; }
    location = /service-pereplanirovka.html { return 301 https://oknproekt.ru/pereplanirovka-okn$is_args$args; }
    location = /service-soglasovanie.html { return 301 https://oknproekt.ru/soglasovanie-mosgornasledie$is_args$args; }
    location = /service-ohrannoe.html { return 301 https://oknproekt.ru/ohrannoe-obyazatelstvo-okn$is_args$args; }
    location = /service-kapremont.html { return 301 https://oknproekt.ru/kapitalnyy-remont-okn$is_args$args; }
    location = /service-rekonstruktsiya.html { return 301 https://oknproekt.ru/rekonstruktsiya-obekta-kulturnogo-naslediya$is_args$args; }
    location = /about-static.html { return 301 https://oknproekt.ru/o-kompanii$is_args$args; }

    location = /blog-arendator-okn.html { return 301 https://oknproekt.ru/blog/arendator-obekta-kulturnogo-naslediya$is_args$args; }
    location = /blog-sobstvennik-okn.html { return 301 https://oknproekt.ru/blog/sobstvennik-obekta-kulturnogo-naslediya-chto-delat$is_args$args; }
    location = /blog-180-fz-okn-2027.html { return 301 https://oknproekt.ru/blog/federalnyy-zakon-180-fz-okn-2027$is_args$args; }
    location = /blog-investicii-okn.html { return 301 https://oknproekt.ru/blog/investicii-v-obekty-kulturnogo-naslediya-kak-klass-aktivov$is_args$args; }
    location = /blog-predpisaniya-okn.html { return 301 https://oknproekt.ru/blog/predpisaniya-i-shtrafy-po-okn-chto-delat-sobstvenniku$is_args$args; }
    location = /blog-predmet-ohrany-okn.html { return 301 https://oknproekt.ru/blog/predmet-ohrany-okn$is_args$args; }
    location = /blog-akt-tehsostoyaniya-okn.html { return 301 https://oknproekt.ru/blog/akt-tehnicheskogo-sostoyaniya-okn$is_args$args; }

    # Complete raw HTML aliases from routeMap; validated by npm run validate.
    location = /blog-pereplanirovka-kvartiry-okn.html { return 301 https://oknproekt.ru/blog/pereplanirovka-kvartiry-v-okn$is_args$args; }
    location = /blog-obespechenie-sohrannosti-okn.html { return 301 https://oknproekt.ru/blog/obespechenie-sohrannosti-okn-pri-provedenii-rabot$is_args$args; }
    location = /blog-redevelopment-okn.html { return 301 https://oknproekt.ru/blog/redevelopment-okn$is_args$args; }
    location = /blog-pokupka-okn.html { return 301 https://oknproekt.ru/blog/pokupka-obekta-kulturnogo-naslediya$is_args$args; }
    location = /blog-zony-ohrany-okn.html { return 301 https://oknproekt.ru/blog/zony-ohrany-i-zashchitnye-zony-okn$is_args$args; }
    location = /blog-stroitelstvo-zashchitnaya-zona-okn.html { return 301 https://oknproekt.ru/blog/mozhno-li-stroit-v-zashchitnoy-zone-okn$is_args$args; }
    location = /blog-okn-krt.html { return 301 https://oknproekt.ru/blog/okn-v-proektah-krt$is_args$args; }
    location = /blog-remont-okn.html { return 301 https://oknproekt.ru/blog/remont-v-obekte-kulturnogo-naslediya$is_args$args; }
    location = /blog-gike-okn.html { return 301 https://oknproekt.ru/blog/istoriko-kulturnaya-ekspertiza-okn-kogda-nuzhna-gike$is_args$args; }
    location = /blog-zadanie-na-raboty-okn.html { return 301 https://oknproekt.ru/blog/zadanie-na-provedenie-rabot-po-sohraneniyu-okn$is_args$args; }
    location = /blog-fasad-okn.html { return 301 https://oknproekt.ru/blog/remont-i-restavratsiya-fasada-okn$is_args$args; }
    location = /service-remont.html { return 301 https://oknproekt.ru/remont-okn$is_args$args; }
    location = /service-remont-fasada.html { return 301 https://oknproekt.ru/remont-fasada-okn$is_args$args; }
    location = /service-obsledovanie.html { return 301 https://oknproekt.ru/obsledovanie-obektov-kulturnogo-naslediya$is_args$args; }
    location = /service-technical-survey.html { return 301 https://oknproekt.ru/tehnicheskoe-obsledovanie-zdaniy$is_args$args; }
    location = /service-technical-conclusion.html { return 301 https://oknproekt.ru/tehnicheskoe-zaklyuchenie$is_args$args; }
    location = /service-laser-scanning.html { return 301 https://oknproekt.ru/lazernoe-skanirovanie-zdaniy$is_args$args; }
    location = /service-gike.html { return 301 https://oknproekt.ru/istoriko-kulturnaya-ekspertiza-okn$is_args$args; }
    location = /service-razreshenie-dkn.html { return 301 https://oknproekt.ru/razreshenie-na-provedenie-rabot-po-sohraneniyu-okn$is_args$args; }

    location ~ ^(.+)/+$ {
        return 301 https://oknproekt.ru$1$is_args$args;
    }

    # Private non-site proxy routes are intentionally excluded from Git.
    # Restore them from the encrypted server configuration backup if required.

    location /api/lead {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|mp4|ico|xml|txt)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri @okn_app;
    }

    location @okn_app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ssl_certificate /etc/letsencrypt/live/oknproekt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oknproekt.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name oknproekt.ru www.oknproekt.ru;
    return 301 https://oknproekt.ru$request_uri;
}
